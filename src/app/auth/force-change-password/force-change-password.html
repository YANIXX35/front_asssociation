<section class="auth-section">
  <div class="auth-card card">
    <h2>Définir votre mot de passe</h2>
    <p class="auth-hint">
      Première connexion : vous devez choisir un nouveau mot de passe avant de continuer.
    </p>

    @if (errorMessage) {
      <div class="alert alert-error">{{ errorMessage }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="new_password">Nouveau mot de passe</label>
        <input id="new_password" type="password" formControlName="new_password" placeholder="8 caractères minimum" />
      </div>
      <div class="form-field">
        <label for="confirm_password">Confirmer le mot de passe</label>
        <input id="confirm_password" type="password" formControlName="confirm_password" />
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Enregistrement...' : 'Valider' }}
      </button>
    </form>
  </div>
</section>
