<section class="auth-section">
  <div class="auth-card card">
    <h2>Réinitialiser le mot de passe</h2>

    @if (message) {
      <div class="alert alert-success">{{ message }}</div>
    }
    @if (errorMessage) {
      <div class="alert alert-error">{{ errorMessage }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="vous@exemple.com" />
      </div>

      <div class="form-field">
        <label for="otp_code">Code OTP (6 chiffres)</label>
        <input id="otp_code" type="text" formControlName="otp_code" placeholder="123456" maxlength="6" />
      </div>

      <div class="form-field">
        <label for="new_password">Nouveau mot de passe</label>
        <input id="new_password" type="password" formControlName="new_password" placeholder="8 caractères minimum" />
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Enregistrement...' : 'Réinitialiser' }}
      </button>
    </form>

    <p class="auth-links">
      <a routerLink="/connexion">Retour à la connexion</a>
    </p>
  </div>
</section>
