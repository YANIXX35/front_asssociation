<section class="inner-hero">
  <div class="container">
    <h1>Offres professionnelles</h1>
  </div>
</section>

<section class="section">
  <div class="container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Titre</th>
          <th>Entreprise</th>
          <th>Type</th>
          <th>Date limite</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (offer of offers; track offer.id) {
          <tr>
            <td>{{ offer.titre }}</td>
            <td>{{ offer.entreprise }}</td>
            <td>{{ offer.type_contrat }}</td>
            <td>{{ offer.date_limite | date: 'dd/MM/yyyy' }}</td>
            <td><a [routerLink]="['/offres-professionnelles', offer.id]" class="btn-outline">Voir</a></td>
          </tr>
        } @empty {
          <tr><td colspan="5">Aucune offre disponible pour le moment.</td></tr>
        }
      </tbody>
    </table>
  </div>
</section>
