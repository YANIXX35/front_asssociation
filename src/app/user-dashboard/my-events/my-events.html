<div class="dashboard-layout">
  <app-dashboard-nav></app-dashboard-nav>

  <div class="dashboard-content">
    <h2>Smart event</h2>

    <table class="data-table">
      <thead>
        <tr>
          <th>Événement</th>
          <th>Date</th>
          <th>Lieu</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (event of events; track event.id) {
          <tr>
            <td>{{ event.titre }}</td>
            <td>{{ event.date | date: 'dd/MM/yyyy HH:mm' }}</td>
            <td>{{ event.lieu }}</td>
            <td>
              @if (isRegistered(event.id)) {
                <span class="badge">Inscrit</span>
              } @else {
                <a [routerLink]="['/smart-event', event.id]" class="btn-outline">S'inscrire</a>
              }
            </td>
          </tr>
        } @empty {
          <tr><td colspan="4">Aucun événement à venir.</td></tr>
        }
      </tbody>
    </table>
  </div>
</div>
