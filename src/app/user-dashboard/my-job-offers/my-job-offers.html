<div class="dashboard-layout">
  <app-dashboard-nav></app-dashboard-nav>

  <div class="dashboard-content">
    <h2>Offres professionnelles</h2>

    <table class="data-table">
      <thead>
        <tr>
          <th>Offre</th>
          <th>Entreprise</th>
          <th>Statut candidature</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (offer of offers; track offer.id) {
          <tr>
            <td>{{ offer.titre }}</td>
            <td>{{ offer.entreprise }}</td>
            <td>{{ applicationFor(offer.id)?.statut || 'Non postulé' }}</td>
            <td><a [routerLink]="['/offres-professionnelles', offer.id]" class="btn-outline">Voir</a></td>
          </tr>
        } @empty {
          <tr><td colspan="4">Aucune offre disponible.</td></tr>
        }
      </tbody>
    </table>
  </div>
</div>
